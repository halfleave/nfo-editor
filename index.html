<title>NFO 编辑器</title>
<style>
  :root{
    --bg:#E9E9F0;
    --surface:rgba(255,255,255,.62);
    --surface-hover:rgba(255,255,255,.74);
    --surface-active:rgba(255,255,255,.86);
    --border:rgba(255,255,255,.72);
    --border-strong:rgba(170,170,185,.5);
    --text:#1D1D1F;
    --text-2:#6b6b70;
    --text-3:#8e8e93;
    --accent:#007AFF;
    --accent-hover:#0067D9;
    --accent-soft:rgba(0,122,255,.15);
    --accent-text:#fff;
    --radius:14px;
    --radius-sm:10px;
    --radius-xs:7px;
    --radius-pill:999px;
    --shadow-card:0 1px 3px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.05);
    --shadow-pop:0 10px 30px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.08);
    --glass-bg:rgba(255,255,255,.55);
    --glass-border:rgba(255,255,255,.72);
    --glass-blur:30px;
    --glass-shadow:0 8px 34px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.06);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#121217;
      --surface:rgba(38,38,46,.6);
      --surface-hover:rgba(58,58,70,.66);
      --surface-active:rgba(72,72,86,.8);
      --border:rgba(255,255,255,.14);
      --border-strong:rgba(255,255,255,.22);
      --text:#F2F2F4;
      --text-2:#a8a8b0;
      --text-3:#8e8e93;
      --accent:#3D8CF0;
      --accent-hover:#5A9EF5;
      --accent-soft:rgba(61,140,240,.22);
      --glass-bg:rgba(38,38,46,.55);
      --glass-border:rgba(255,255,255,.16);
      --glass-blur:30px;
      --glass-shadow:0 8px 34px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.3);
      --shadow-card:0 1px 3px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
      --shadow-pop:0 10px 30px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--font);
    color:var(--text);
    background:var(--bg);
    background-image:
      radial-gradient(1200px 600px at 15% -10%, rgba(0,122,255,.10), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, rgba(125,95,255,.10), transparent 55%);
    background-attachment:fixed;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    min-height:100dvh;
  }
  .page{width:100%;max-width:580px;text-align:center;}
  .brand{display:inline-flex;align-items:center;gap:12px;margin-bottom:4px;}
  .logo{
    width:46px;height:46px;border-radius:14px;
    background:linear-gradient(145deg,var(--accent),#5A9EF5);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:20px;
    box-shadow:var(--shadow-card);
  }
  h1{font-size:22px;font-weight:650;margin:0;letter-spacing:-.3px;}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:34px;}
  @media (max-width:460px){.cards{grid-template-columns:1fr;}}
  .card{
    position:relative;text-align:center;
    padding:44px 22px;
    border-radius:var(--radius);
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(var(--glass-blur));
    -webkit-backdrop-filter:blur(var(--glass-blur));
    box-shadow:var(--glass-shadow);
    cursor:pointer;text-decoration:none;color:inherit;
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  }
  .card:hover{transform:translateY(-2px);background:var(--surface-hover);}
  .card:active{transform:translateY(0);background:var(--surface-active);}
  .card.recommend{
    border-color:var(--accent);
    box-shadow:0 0 0 1.5px var(--accent), var(--glass-shadow);
  }
  .badge{
    position:absolute;top:14px;right:14px;
    font-size:11px;font-weight:600;
    color:var(--accent-text);background:var(--accent);
    padding:3px 9px;border-radius:var(--radius-pill);
  }
  .ic{
    width:54px;height:54px;border-radius:15px;
    background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;
  }
  .ic svg{width:26px;height:26px;display:block;}
  .go{
    font-size:15px;font-weight:600;color:var(--accent);
    display:inline-flex;align-items:center;gap:4px;
  }
  .auto{
    margin-top:34px;font-size:13.5px;color:var(--text-2);
    display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  }
  .countdown{
    font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);
    min-width:14px;text-align:center;
  }
  .cancel{
    font-size:13px;font-weight:600;color:var(--text-2);
    background:none;border:1px solid var(--border-strong);
    padding:5px 14px;border-radius:var(--radius-pill);
    cursor:pointer;transition:background .15s ease;
  }
  .cancel:hover{background:var(--surface);}
  .bar{
    margin:16px auto 0;max-width:360px;height:5px;border-radius:var(--radius-pill);
    background:var(--surface);overflow:hidden;
  }
  .bar > i{
    display:block;height:100%;width:100%;
    background:linear-gradient(90deg,var(--accent),#5A9EF5);
    transform-origin:left;transform:scaleX(1);
    transition:transform .25s linear;
  }
</style>
</head>
<body data-page-node-id="asgwogfN6fDI1E511xoQ9w">
  <div class="page" data-page-node-id="g7wEN1L8oIeqajFQIoxKY1">

      <div class="logo" data-page-node-id="KqUKaAY9iTx8bmuv6jG1gs">N</div>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" data-page-node-id="es2DHwcjM37bditvuDaKAS">

  </div>

<script>
(function(){
  var meta = document.querySelector('meta[name=theme-color]');
  if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches && meta){
    meta.setAttribute('content', '#121217');
  }

  var ua = navigator.userAgent.toLowerCase();
  var isIOS = /iphone|ipad|ipod/.test(ua) || (ua.indexOf('macintosh') > -1 && navigator.maxTouchPoints > 1);
  var isMobile = isIOS || /android|webos|blackberry|iemobile|opera mini/.test(ua)
    || ('ontouchstart' in window && window.innerWidth < 1024);
  var target = isMobile ? 'nfo-editor-ios.html' : 'nfo-editor.html';
  var targetName = isMobile ? '移动版' : '桌面版';

  var cardPc = document.getElementById('cardPc');
  var cardMobile = document.getElementById('cardMobile');
  var rec = isMobile ? cardMobile : cardPc;
  rec.classList.add('recommend');
  var badge = document.createElement('span');
  badge.className = 'badge';
  badge.textContent = '推荐';
  rec.appendChild(badge);

  var autoTextEl = document.getElementById('autoText');
  var countEl = document.getElementById('count');
  var barEl = document.getElementById('bar');
  var autoRow = document.getElementById('autoRow');
  var barWrap = document.getElementById('barWrap');

  autoTextEl.textContent = ' 秒后进入' + targetName;

  var total = 5000, step = 200, elapsed = 0, timer = null, redirecting = false;

  function go(){
    if (redirecting) return;
    redirecting = true;
    clearTimeout(timer);
    autoTextEl.textContent = ' 正在进入' + targetName + '…';
    countEl.textContent = '0';
    location.replace(target);
  }
  function tick(){
    elapsed += step;
    var left = Math.max(0, Math.ceil((total - elapsed) / 1000));
    countEl.textContent = left;
    barEl.style.transform = 'scaleX(' + Math.max(0, (total - elapsed) / total) + ')';
    if (elapsed >= total){ go(); }
    else { timer = setTimeout(tick, step); }
  }

  cardPc.addEventListener('click', function(e){ e.preventDefault(); location.replace('nfo-editor.html'); });
  cardMobile.addEventListener('click', function(e){ e.preventDefault(); location.replace('nfo-editor-ios.html'); });
  document.getElementById('cancelBtn').addEventListener('click', function(){
    clearTimeout(timer); timer = null;
    autoRow.style.display = 'none';
    barWrap.style.display = 'none';
  });

  timer = setTimeout(tick, step);
})();
</script>
